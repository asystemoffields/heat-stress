<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>running…</title></head>
<body><pre id="o">running…</pre>
<script type="module">
import { computeWBGT, wbgtBoM } from './js/wbgt.js';
import { cosZenith } from './js/solar.js';
try {
  const cases = [
    { name: 'hot dry sun',   Ta: 35, RH: 50, wind10: 1.5, rsds: 800, rsdsDiffuse: 150, pressure: 1013, cloud: 10, cosz: 0.90 },
    { name: 'hot humid sun', Ta: 33, RH: 75, wind10: 1.0, rsds: 750, rsdsDiffuse: 200, pressure: 1010, cloud: 20, cosz: 0.85 },
    { name: 'warm night',    Ta: 28, RH: 85, wind10: 1.0, rsds: 0,   rsdsDiffuse: 0,   pressure: 1013, cloud: 50, cosz: -0.5 },
    { name: 'mild breezy',   Ta: 25, RH: 40, wind10: 5.0, rsds: 500, rsdsDiffuse: 150, pressure: 1013, cloud: 30, cosz: 0.70 },
    { name: 'extreme humid', Ta: 38, RH: 60, wind10: 0.8, rsds: 850, rsdsDiffuse: 180, pressure: 1005, cloud: 5,  cosz: 0.95 },
  ];
  const out = cases.map((c) => {
    const w = computeWBGT(c);
    return { name: c.name, Ta: c.Ta, RH: c.RH,
      wbgt: +w.wbgt.toFixed(2), shade: +w.wbgtShade.toFixed(2),
      Tg: +w.Tg.toFixed(2), Tnw: +w.Tnw.toFixed(2),
      bomShade: +wbgtBoM(c.Ta, c.RH).toFixed(2),
      wind2m: +w.wind2m.toFixed(2), f: +w.f.toFixed(2) };
  });
  // solar sanity: local noon at equator near June solstice → sun nearly overhead
  const solarNoonEq = +cosZenith(0, 0, new Date(Date.UTC(2026, 5, 21, 12, 0, 0))).toFixed(3);
  const midnightEq = +cosZenith(0, 0, new Date(Date.UTC(2026, 5, 21, 0, 0, 0))).toFixed(3);
  window.__WBGT = { out, solarNoonEq, midnightEq };
  document.title = 'WBGT_OK';
  document.getElementById('o').textContent = JSON.stringify(window.__WBGT, null, 2);
} catch (e) {
  window.__WBGT = { error: String(e), stack: e && e.stack };
  document.title = 'WBGT_ERR';
  document.getElementById('o').textContent = String(e) + '\n' + (e && e.stack);
}
</script></body></html>
